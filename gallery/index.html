<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Veight's art gallery.">
  <link rel="icon" type="image/x-icon" href="../images/favicon.png">
  <title>Art gallery — Veight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery-shell">
    <header class="gallery-header">
      <a class="wordmark" href="../">Veight<span>.</span></a>
      <a class="back-link" href="../">← Main page</a>
    </header>

    <section class="gallery-intro" aria-labelledby="gallery-title">
      <p class="eyebrow">ART ARCHIVE</p>
      <h1 id="gallery-title">Things I comissioned<span>.</span></h1>
      <p class="gallery-description">A small collection of my commissions.</p>
    </section>

    <section aria-labelledby="sfw-title">
      <h2 class="visually-hidden" id="sfw-title">Artwork</h2>
      <div class="art-grid" id="sfwGallery"></div>
    </section>

    <section class="nsfw-section" aria-labelledby="nsfw-title">
      <h2 class="visually-hidden" id="nsfw-title">Adult artwork</h2>
      <p class="nsfw-note">18+ content</p>
      <button class="gallery-button" id="openNsfw" type="button">Show</button>
      <div class="art-grid hidden" id="nsfwGallery"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
